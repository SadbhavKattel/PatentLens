[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patentlens"
version = "1.0.0"
description = "Patent similarity search over CPC G06N3 (AI/ML) patents, evaluated against real citation data."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/SadbhavKattel/PatentLens"

# Dependencies live in requirements.txt so there is a single source of truth for both
# `pip install -r requirements.txt` and `pip install -e .`.
[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]
